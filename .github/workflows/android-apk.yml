
name: Build 8BallProAssistant APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: unzip -q 8BallProAssistant_PHONE_BUILD_READY.zip -d .

      - name: Build APK
        working-directory: 8BallProAssistant
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8BallProAssistant-APK
          path: 8BallProAssistant/app/build/outputs/apk/debug/app-debug.apk
